services:
  backend:
    build:
      context: ./backend
      args:
        DOCKER_REGISTRY_PREFIX: ${DOCKER_REGISTRY_PREFIX:-}
    env_file: .env
    environment:
      DB_PATH: /data/copilot.db
      CORS_ALLOW_ORIGINS: '["http://localhost:${FRONTEND_PORT:-8080}"]'
    volumes:
      - app-data:/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_TARGET: http://backend:8000
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:5173"
    restart: unless-stopped

volumes:
  app-data:
